name: Replit Extension CI

on:
  push:
    branches: [main, task-2.2-Replit-workspace]
    paths:
      - 'extensions/deadheaven07/replit-workspace-document-panel/**'
      - '.github/workflows/replit-extension-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/deadheaven07/replit-workspace-document-panel/**'
      - '.github/workflows/replit-extension-ci.yml'

jobs:
  test-and-verify:
    name: Typecheck, Unit Tests & Playwright E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/deadheaven07/replit-workspace-document-panel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extensions/deadheaven07/replit-workspace-document-panel/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Playwright E2E Suite
        run: npm run test:e2e

      - name: Production Vite Build
        run: npm run build

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: extensions/deadheaven07/replit-workspace-document-panel/test-results/
          retention-days: 7
