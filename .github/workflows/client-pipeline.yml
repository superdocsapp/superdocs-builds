name: SuperDocs client pipeline

on:
  push:
    paths:
      - 'extensions/oviya12/doctask2-oviya-senthilkumar/**'
      - '.github/workflows/client-pipeline.yml'
  pull_request:
    paths:
      - 'extensions/oviya12/doctask2-oviya-senthilkumar/**'
      - '.github/workflows/client-pipeline.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/oviya12/doctask2-oviya-senthilkumar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate clients, gate compatibility, and smoke test
        run: make all
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            extensions/oviya12/doctask2-oviya-senthilkumar/reports/compat.md
            extensions/oviya12/doctask2-oviya-senthilkumar/reports/compat.json
            extensions/oviya12/doctask2-oviya-senthilkumar/reports/breaking-demo/compat.md
