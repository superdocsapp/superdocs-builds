[project]
name = "superdocs-enterprise-integration-connector"
version = "1.0.0"
description = "Enterprise Integration-Platform Connector for SuperDocs (Workato/Tray/Boomi/MuleSoft-adaptable)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.28",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.6,<1",
]

[tool.setuptools]
packages = ["connector", "connector.operations", "schemas", "recipes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
