<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creating a Project</title>
</head>

<body>

<article>

    <h1>How to create a project</h1>

    <p>
        Open SuperDocs from your workspace.
    </p>

    <p>
        Select Create Project from the dashboard.
    </p>

    <p>
        Press Ctrl + K to open the project command menu.
    </p>

    <figure>
        <img
            src="screenshots/en/create-project.svg"
            alt="Create Project screen"
        >

        <figcaption>
            Figure 1: Create Project
        </figcaption>
    </figure>

    <p>
        Enter the project name and select Create.
    </p>

    <h2>Install the CLI</h2>

    <p>
        Run <code>npm install</code> before starting the application.
    </p>

</article>

</body>
</html>
