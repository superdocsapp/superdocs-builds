[project]
name = "superdocs-vertical-prompts"
version = "0.1.0"
description = "Vertical workflow-prompt packs (MCP prompts / slash commands) layered on the SuperDocs MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "anyio>=4.0"]

[tool.setuptools.packages.find]
include = ["vertical_prompts*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
