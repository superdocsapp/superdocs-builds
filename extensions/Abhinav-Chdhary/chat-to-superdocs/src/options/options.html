<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat to SuperDocs settings</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>Chat to SuperDocs settings</h1><p>Set the URL of your local bridge. The bridge, not this extension, keeps your SuperDocs API key.</p><label>Bridge URL <input id="bridge-url" type="url" placeholder="http://127.0.0.1:8787"></label><button id="save">Save</button><p id="status" role="status"></p><h2>Connection safety</h2><p>The bridge accepts only the extension origin configured in its environment. Do not use a bridge that accepts requests from arbitrary websites.</p></main><script type="module" src="options.js"></script></body></html>
