<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat to SuperDocs</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><h1>Chat to SuperDocs</h1><p id="status" role="status">Capture a completed ChatGPT or Claude answer.</p></header>
      <button id="capture" class="primary">Capture latest answer</button>
      <section id="capture-card" hidden>
        <p id="capture-meta"></p>
        <div id="preview" class="preview"></div>
      </section>
      <label>Document title <input id="title" value="Chat notes"></label>
      <label>Template <select id="template"><option value="brief">Decision brief</option><option value="notes">Research notes</option><option value="blank">Blank document</option></select></label>
      <fieldset><legend>Destination</legend><label><input type="radio" name="mode" value="new" checked> Create a new growing document</label><label><input type="radio" name="mode" value="append"> Append to the active document</label></fieldset>
      <button id="start" class="primary" disabled>Send for review</button>
      <section id="review" hidden><h2>Review proposed changes</h2><form id="decisions"></form><button id="apply" class="primary">Apply selected changes</button></section>
      <button id="export" hidden>Export DOCX</button>
      <p class="hint">The extension never receives your API key. Configure its localhost bridge in <a href="#" id="settings">settings</a>.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
