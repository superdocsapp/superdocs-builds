title = "sdmock"

[extend]
useDefault = true

# API keys as SuperDocs actually issues them. The default ruleset does not know these
# prefixes, and this repository is full of recorded API traffic -- exactly the place a
# key is most likely to end up by accident.
[[rules]]
id = "superdocs-personal-key"
description = "SuperDocs personal API key"
regex = '''\bsk_[A-Za-z0-9]{24,}\b'''
keywords = ["sk_"]

[[rules]]
id = "superdocs-org-key"
description = "SuperDocs organization API key"
regex = '''\blce_[A-Za-z0-9]{16,}\b'''
keywords = ["lce_"]

[allowlist]
description = "Placeholders and redactions, which are the point rather than a leak"
regexes = [
  '''sk_YOUR_API_KEY''',
  '''sk_test[A-Za-z0-9_]*''',
  '''sk_REDACTED''',
  '''lce_REDACTED''',
  '''your-key-here''',
  '''sk_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4''',   # the docs' own illustrative key
  # The deliberately-fake credentials in contract/test_scrubber_has_teeth.py. They have
  # to look like real keys -- that is the point of the test -- so they are named here
  # one by one rather than waved through by a loose pattern.
  '''sk_EXAMPLEnotarealkey00000000000000''',
  '''lce_EXAMPLEnotarealorgkey000''',
]

# Note, deliberately: no path is blanket-allowlisted. It is tempting to exempt
# contract/ or cassettes/ wholesale, and it is exactly wrong -- a recorded fixture and a
# leak test are the two places a real credential is most likely to land, because in both
# a credential looks like it belongs. That is how a real key got into this repository
# once already. Every exemption above names one literal value.
