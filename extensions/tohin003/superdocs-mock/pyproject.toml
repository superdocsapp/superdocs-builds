[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdmock"
version = "0.1.0"
description = "Offline mock server and contract-test suite for the SuperDocs REST API and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tohin Majumder" }]
keywords = ["superdocs", "mock", "contract-testing", "mcp", "openapi", "test-double"]

# Kept deliberately small: startup time is a graded property of this project.
# Anything added here must justify itself against docs/benchmarks/.
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only what the contract suite and the recorder need. Not required to run the mock.
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "jsonschema>=4.21",
]
record = [
  "httpx>=0.27",
]

[project.scripts]
sdmock = "sdmock.cli:main"

# Installing the package is the whole setup: the `superdocs_mock` fixture appears in any
# pytest run without a conftest entry.
[project.entry-points.pytest11]
sdmock = "sdmock.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/sdmock"]

# The fixtures ship inside the wheel, so `pip install sdmock` gives a working mock with
# no repository checkout. The container and a dev checkout find them the same way, via
# sdmock.paths.
[tool.hatch.build.targets.wheel.force-include]
"spec" = "sdmock/_data/spec"
"cassettes" = "sdmock/_data/cassettes"

[tool.pytest.ini_options]
testpaths = ["contract"]
addopts = "-q --strict-markers"
markers = [
  "billable: hits the live service and spends operations; requires --allow-billing",
  "rest: exercises the REST transport",
  "mcp: exercises the MCP transport",
  "parity: asserts REST and MCP agree",
]
