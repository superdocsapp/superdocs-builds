[project]
name = "superdocs-python"
version = "0.2.0"
description = "Typed Python SDK for the SuperDocs API."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.package-data]
superdocs_sdk = ["py.typed"]
