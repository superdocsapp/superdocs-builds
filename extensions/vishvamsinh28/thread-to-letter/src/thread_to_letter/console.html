<!doctype html>
<meta charset="utf-8">
<title>Thread to letter — demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f8fc;--surface:#fff;--sunk:#f1f3f4;--ink:#202124;--dim:#5f6368;--faint:#80868b;
    --line:#e0e3e7;--sel:#e8f0fe;--accent:#1a73e8;--ok:#1e8e3e;--warn:#b06000;--bad:#c5221f;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-family:"Google Sans",Roboto,ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16181c;--surface:#1e2126;--sunk:#24272c;--ink:#e8eaed;--dim:#9aa0a6;--faint:#80868b;
    --line:#2f3339;--sel:#1f3350;--accent:#8ab4f8;--ok:#81c995;--warn:#fdd663;--bad:#f28b82;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
    height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* demo banner */
  .demo{background:#3c4043;color:#fff;font-size:11.5px;padding:5px 16px;display:flex;
    gap:10px;align-items:center;letter-spacing:.02em}
  .demo b{font-weight:600}
  @media (prefers-color-scheme:dark){.demo{background:#0f1114}}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--surface);
    border-bottom:1px solid var(--line);flex-shrink:0}
  .logo{font-size:19px;font-weight:500;letter-spacing:-.01em;color:var(--dim)}
  .search{flex:1;max-width:660px;background:var(--sunk);border:1px solid transparent;
    border-radius:8px;padding:8px 15px;color:var(--ink);font-size:13.5px;outline:none}
  .search:focus{border-color:var(--accent);background:var(--surface)}
  .search::placeholder{color:var(--faint)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
    font-size:11.5px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.live{color:var(--ok);border-color:var(--ok);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .dot.pulse{animation:p 1.3s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  /* layout */
  .app{flex:1;display:grid;grid-template-columns:170px minmax(300px,1fr) 372px;min-height:0}
  @media (max-width:1180px){.app{grid-template-columns:minmax(280px,1fr) 360px}
    .nav{display:none}}
  .nav{padding:12px 8px;overflow-y:auto}
  .nav a{display:flex;gap:14px;align-items:center;padding:7px 14px;border-radius:0 20px 20px 0;
    color:var(--dim);text-decoration:none;font-size:13.5px}
  .nav a.on{background:var(--sel);color:var(--accent);font-weight:600}
  .nav a .c{margin-left:auto;font-size:11.5px}
  .mail{background:var(--surface);border-left:1px solid var(--line);
    border-right:1px solid var(--line);overflow-y:auto;min-height:0}
  .side{overflow-y:auto;min-height:0;padding:12px}
  /* list */
  .row{display:grid;grid-template-columns:170px 1fr auto;gap:14px;align-items:baseline;
    padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
  .row:hover{box-shadow:inset 0 0 0 99px rgba(128,128,128,.05)}
  .row.on{background:var(--sel)}
  .row .from{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sub span{color:var(--dim);font-weight:400}
  .row .when{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .row .n{color:var(--dim);font-weight:400;font-size:12px}
  .flag{color:var(--warn);font-size:11px}
  /* thread */
  .thread{padding:18px 22px}
  .thread h1{font-size:20px;font-weight:400;margin:0 0 16px}
  .m{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;
    border-top:1px solid var(--line)}
  .m:first-of-type{border-top:0}
  .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-size:13px;font-weight:600}
  .m .who{font-weight:600;font-size:13.5px}
  .m .meta{color:var(--dim);font-size:12px}
  .m .txt{margin-top:5px;white-space:pre-wrap;font-size:13.5px}
  .m.fold .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;color:var(--dim)}
  /* add-on panel */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .panel h2{margin:0;padding:12px 15px;font-size:13.5px;font-weight:600;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .panel h2 .badge{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--dim)}
  .panel .in{padding:14px 15px}
  .lede{color:var(--dim);font-size:12.5px;margin:0 0 13px}
  button{font:inherit;font-size:13.5px;padding:8px 17px;border-radius:20px;cursor:pointer;
    border:1px solid transparent;background:var(--accent);color:#fff;font-weight:600}
  button.ghost{background:transparent;border-color:var(--line);color:var(--accent)}
  button:hover:not(:disabled){filter:brightness(1.06)}
  button:disabled{opacity:.45;cursor:default}
  button.small{padding:5px 12px;font-size:12.5px}
  .c{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:9px;
    display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;font-size:13px}
  .c.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,transparent)}
  .c.bad{border-color:var(--bad)}
  .c{cursor:pointer}
  .c input{width:15px;height:15px;margin-top:2px;accent-color:var(--ok);pointer-events:none}
  .chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;border:1px solid}
  .chip.firm{color:var(--ok);border-color:var(--ok)}
  .chip.superseded{color:var(--warn);border-color:var(--warn)}
  .chip.hedged,.chip.second-hand,.chip.proposed{color:var(--dim);border-color:var(--line)}
  .chip.unv{color:var(--bad);border-color:var(--bad)}
  .obl{font-weight:600;margin:4px 0 1px}
  .sm{color:var(--dim);font-size:11.5px}
  .q{font-family:var(--mono);font-size:11px;background:var(--sunk);border-radius:5px;
    padding:5px 8px;margin-top:5px;color:var(--dim)}
  .note{border-radius:7px;padding:8px 11px;font-size:12px;margin-bottom:11px}
  .note.warn{border:1px solid var(--warn);color:var(--warn)}
  .note.err{border:1px solid var(--bad);color:var(--bad)}
  .note.run{border:1px solid var(--accent);color:var(--accent);display:flex;gap:9px;
    align-items:flex-start}
  .note.run .dot{margin-top:5px;flex-shrink:0}
  /* compose */
  .compose{position:fixed;right:18px;bottom:0;width:520px;max-width:calc(100vw - 36px);
    background:var(--surface);border:1px solid var(--line);border-radius:9px 9px 0 0;
    box-shadow:0 -2px 18px rgba(0,0,0,.18);z-index:50;overflow:hidden}
  .compose header{background:var(--sunk);padding:9px 15px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:10px}
  .compose .f{padding:7px 15px;border-bottom:1px solid var(--line);font-size:13px;
    color:var(--dim)}
  .compose .f b{color:var(--ink);font-weight:400}
  .compose .b{padding:13px 15px;white-space:pre-wrap;font-size:13.5px;max-height:220px;
    overflow:auto}
  .att{margin:0 15px 13px;border:1px solid var(--line);border-radius:7px;padding:8px 11px;
    display:flex;gap:9px;align-items:center;font-size:12.5px}
  .att .x{width:26px;height:26px;border-radius:4px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:9px;font-weight:700}
  .compose .actions{padding:11px 15px;display:flex;gap:9px;align-items:center;
    border-top:1px solid var(--line)}
  /* feed */
  .feed{font-family:var(--mono);font-size:11px;max-height:190px;overflow-y:auto}
  .call{display:grid;grid-template-columns:38px 1fr 34px 44px;gap:6px;padding:4px 15px;
    border-bottom:1px solid var(--line);align-items:baseline}
  .call:last-child{border-bottom:0}
  .call .mm{font-weight:700;color:var(--faint)}
  .call .pp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .call .ss{text-align:right;color:var(--ok)} .call .ss.e{color:var(--bad)}
  .call .dd{text-align:right;color:var(--faint)}
  .call .nn{grid-column:2/-1;color:var(--faint);font-size:10px}
  .call .nn b{color:var(--warn)}
  .empty{color:var(--dim);font-size:12.5px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .segb{background:transparent;color:var(--dim);border:0;border-radius:0;padding:5px 15px;
    font-size:12.5px;font-weight:500}
  .segb.on{background:var(--sel);color:var(--accent);font-weight:600}
  .counts{display:flex;flex-wrap:wrap;gap:13px;font-size:11.5px;margin-bottom:12px}
  .counts b{display:block;font-size:16px;font-weight:600}
</style>

<div class="demo">
  <b>DEMO</b>
  <span>A simulated mail client, not Gmail. The messages are invented. The add-on panel on
  the right is the real thing, calling the real SuperDocs API.</span>
</div>

<div class="top">
  <span class="logo">Mail</span>
  <input class="search" id="q" placeholder="Search mail — Esc to clear" autocomplete="off">
  <span class="pill" id="conn"><span class="dot"></span><span id="conn-label">…</span></span>
  <span class="pill" id="key"></span>
  <span class="pill" id="ops"></span>
</div>

<div class="app">
  <nav class="nav">
    <a id="nav-inbox" class="on" data-act="inbox" href="#">Inbox
      <span class="c" id="nav-count"></span></a>
    <a id="nav-draft" data-act="drafts" href="#">Drafts
      <span class="c" id="nav-drafts"></span></a>
  </nav>

  <div class="mail" id="mail"></div>

  <div class="side">
    <div class="panel">
      <h2>📄 Thread to letter<span class="badge" id="badge">add-on</span></h2>
      <div class="in" id="addon"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>SuperDocs API<span class="badge" id="call-count"></span></h2>
      <div class="feed" id="feed"></div>
    </div>
  </div>
</div>

<div id="compose"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const ms = n => n >= 1000 ? (n/1000).toFixed(1)+"s" : n+"ms";

  let callSeq = 0, shape = "letter", query = "", view = "inbox", last = null;
  // Signatures, so a region is only rebuilt when what it shows has changed. Rebuilding
  // on every poll destroys the element under the pointer, and a click that straddles a
  // rebuild is simply lost — which is exactly how "Find commitments" did nothing.
  const drawn = {inbox:null, thread:null, addon:null, compose:null};

  const HUES = [210, 145, 25, 280, 340, 190];
  const hue = s => HUES[[...(s||"x")].reduce((a,c)=>a+c.charCodeAt(0),0) % HUES.length];
  const initials = s => (s||"?").split(/[\s<]/)[0].slice(0,1).toUpperCase()
    + ((s||"").split(/\s+/)[1]||"").slice(0,1).toUpperCase();

  /* One delegated listener, bound once. Re-rendering can never unbind it. */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if(!el) return;
    e.preventDefault();
    const act = el.dataset.act, arg = el.dataset.arg;
    // Views switch from state we already have, so the pane changes on the click rather
    // than after a round-trip. Only the two that need the server wait for it.
    if(act === "open")      { view = "thread"; post("/api/open", {name: arg}); }
    else if(act === "back" || act === "inbox") { view = "inbox"; post("/api/close"); }
    else if(act === "drafts"){ view = "drafts"; drawn.thread = null;
                               if(last) render(last); poll(); }
    else if(act === "extract"){ post("/api/extract"); }
    else if(act === "write"){ post("/api/letter", {shape}); }
    else if(act === "shape"){ shape = arg; drawn.addon = null; poll(); }
    else if(act === "toggle"){ toggle(Number(arg)); }
    else if(act === "fold") { el.classList.toggle("fold"); }
  });

  $("q").addEventListener("input", e => { query = e.target.value.toLowerCase();
    drawn.inbox = null; if(last) render(last); });
  $("q").addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    e.target.value = ""; query = ""; drawn.inbox = null; if(last) render(last);
  });

  async function poll(){
    try{ last = await (await fetch(`/api/state?since=${callSeq}`)).json(); render(last); }
    catch(e){ $("conn-label").textContent = "console unreachable"; }
  }

  function render(s){
    const c = s.connection;
    $("conn").className = "pill" + (c.live ? " live" : "");
    $("conn-label").textContent = (c.live ? "LIVE · " : "local · ") + c.label;
    $("key").textContent = "key " + c.key;
    $("ops").textContent = `${c.operations} operation${c.operations===1?"":"s"}`;
    $("nav-count").textContent = s.inbox.length;
    $("nav-drafts").textContent = s.draft ? "1" : "";
    $("nav-inbox").className = view === "drafts" ? "" : "on";
    $("nav-draft").className = view === "drafts" ? "on" : "";

    if(view === "drafts") renderDrafts(s);
    else if(!s.thread) renderInbox(s);
    else renderThread(s);

    renderAddon(s);
    renderFeed(s);
    renderCompose(s);
  }

  function match(t){
    if(!query) return true;
    return (t.subject + " " + t.senders.join(" ") + " " + t.snippet).toLowerCase()
      .includes(query);
  }

  function renderInbox(s){
    const rows = s.inbox.filter(match);
    const sig = query + "|" + rows.map(t=>t.name).join(",");
    if(drawn.inbox === sig) return;
    drawn.inbox = sig; drawn.thread = null;
    $("mail").innerHTML = rows.length ? rows.map(t => `
      <div class="row" data-act="open" data-arg="${esc(t.name)}">
        <span class="from">${esc(t.senders.slice(0,2).join(", "))}
          <span class="n">${t.count>1?" "+t.count:""}</span></span>
        <span class="sub">${esc(t.subject)}
          ${t.hostile?'<span class="flag" title="contains text aimed at an automated reader">⚠</span>':""}
          <span>— ${esc(t.snippet)}</span></span>
        <span class="when">${esc(t.date.slice(4,11))}</span>
      </div>`).join("")
      : `<div style="padding:34px 20px" class="empty">No messages match “${esc(query)}”.</div>`;
  }

  function renderThread(s){
    const t = s.thread;
    if(drawn.thread === t.name) return;
    drawn.thread = t.name; drawn.inbox = null;
    $("mail").innerHTML = `<div class="thread">
      <button class="ghost small" data-act="back">← Inbox</button>
      <h1 style="margin-top:14px">${esc(t.subject)}</h1>
      ${t.messages.map((m,i) => `
        <div class="m ${i < t.messages.length-2 ? "fold" : ""}" data-act="fold">
          <div class="av" style="background:hsl(${hue(m.sender)} 52% 45%)">${esc(initials(m.sender))}</div>
          <div>
            <div class="who">${esc(m.sender)}</div>
            <div class="meta">${esc((m.date||"").slice(0,22))}</div>
            <div class="txt">${esc(m.body)}</div>
          </div>
        </div>`).join("")}
    </div>`;
  }

  function renderDrafts(s){
    const sig = "drafts:" + (s.draft ? s.draft.subject : "");
    if(drawn.thread === sig) return;
    drawn.thread = sig; drawn.inbox = null;
    $("mail").innerHTML = s.draft ? `<div class="thread">
        <button class="ghost small" data-act="inbox">← Inbox</button>
        <h1 style="margin-top:14px">${esc(s.draft.subject)}</h1>
        <div class="m"><div class="av" style="background:hsl(210 52% 45%)">✉</div>
          <div><div class="who">Draft — to ${esc(s.draft.to)}</div>
          <div class="txt">${esc(s.draft.body)}</div></div></div>
      </div>`
      : `<div style="padding:34px 20px" class="empty">No drafts yet. Open a thread and
         write a letter.</div>`;
  }

  function renderAddon(s){
    const busy = !!s.busy;
    const sig = JSON.stringify([
      s.thread && s.thread.name, busy, s.error, shape,
      s.commitments.map(c=>[c.quote, c.chosen, c.quote_found]),
      (s.thread||{}).findings ? s.thread.findings.length : 0,
      s.dangling.length,
    ]);
    if(drawn.addon === sig) return;
    drawn.addon = sig;

    if(!s.thread){
      $("addon").innerHTML = '<p class="lede">Open a message. This panel is where the '
        + 'add-on lives in Gmail.</p>';
      $("badge").textContent = "add-on"; return;
    }

    let html = "";
    if(s.error) html += `<div class="note err">${esc(s.error)}</div>`;
    if(s.thread.findings.length)
      html += `<div class="note warn"><b>This thread contains text aimed at an automated
        reader.</b> Reported, never followed — check who sent it before ticking anything
        from that message.</div>`;
    if(busy) html += `<div class="note run"><span class="dot pulse"></span>
      ${esc(s.busy)}<br><span class="sm">A turn takes 15–45 seconds.</span></div>`;

    if(!s.commitments.length){
      $("badge").textContent = "add-on";
      html += `<p class="lede">Pull out what people actually committed to in this thread —
        not a polite summary. You review each one before anything is written.</p>
        <button data-act="extract" ${busy?"disabled":""}>
          ${busy?"Reading…":"Find commitments"}</button>
        <p class="sm" style="margin:9px 0 0">${c_live(s)}</p>`;
      $("addon").innerHTML = html;
      return;
    }

    $("badge").textContent = `${s.commitments.length} found`;
    const k = s.counts || {};
    html += `<div class="counts">
      <div><b>${k.usable||0}</b>going in</div>
      <div><b>${k.superseded||0}</b>superseded</div>
      <div><b>${k.hedged||0}</b>hedged</div>
      <div><b>${k["second-hand"]||0}</b>second-hand</div>
      <div><b>${k.unverified||0}</b>unquotable</div></div>`;
    if(s.dangling.length)
      html += `<div class="note warn"><b>A commitment was replaced and the replacement is
        missing.</b> The letter would omit the obligation that actually stands.</div>`;

    html += s.commitments.map((c,i) => `
      <div class="c ${c.chosen?"on":""} ${c.quote_found?"":"bad"}"
           data-act="toggle" data-arg="${i}">
        <input type="checkbox" ${c.chosen?"checked":""} tabindex="-1">
        <div>
          <span class="chip ${esc(c.status)}">${esc(c.status)}</span>
          ${c.quote_found?"":'<span class="chip unv">not in thread</span>'}
          <div class="obl">${esc(c.party)} — ${esc(c.obligation)}</div>
          <div class="sm">${c.due?"due "+esc(c.due):"no date"}${c.located_in?" · message "+c.located_in:""}</div>
          <div class="q">“${esc(c.quote)}”</div>
        </div>
      </div>`).join("");

    const n = s.commitments.filter(x=>x.chosen).length;
    const noun = shape === "memo" ? "memo" : "letter";
    html += `<div class="seg" style="margin:2px 0 11px">
        <button class="segb ${shape==="letter"?"on":""}" data-act="shape" data-arg="letter">Letter</button>
        <button class="segb ${shape==="memo"?"on":""}" data-act="shape" data-arg="memo">Memo</button>
      </div>
      <button data-act="write" ${busy?"disabled":""}>
        ${busy?"Writing…":`Write ${noun} &amp; attach to reply`}</button>
      <p class="sm" style="margin:9px 0 0">${n} selected · ${c_live(s)}</p>`;
    $("addon").innerHTML = html;
  }

  const c_live = s => s.connection.live
    ? "one operation against your account" : "one operation";

  function renderCompose(s){
    const sig = s.draft ? s.draft.subject + s.draft.body.length : "";
    if(drawn.compose === sig) return;
    drawn.compose = sig;
    if(!s.draft){ $("compose").innerHTML = ""; return; }
    $("compose").innerHTML = `<div class="compose">
      <header>New message</header>
      <div class="f">To <b>${esc(s.draft.to)}</b></div>
      <div class="f">Subject <b>${esc(s.draft.subject)}</b></div>
      <div class="b">${esc(s.draft.body)}</div>
      <div class="att"><span class="x">DOCX</span>
        <span>${esc(s.draft.attachment)}</span>
        <a class="sm" style="margin-left:auto;color:var(--accent)"
           href="/api/export?fmt=docx">Download</a></div>
      <div class="actions">
        <button disabled title="This is a demo. It never sends mail.">Send</button>
        <a class="sm" style="color:var(--accent)" href="/api/reply?fmt=docx">Save .eml</a>
        <span class="sm" style="margin-left:auto">nothing is ever sent</span>
      </div></div>`;
  }

  function renderFeed(s){
    if(s.calls && s.calls.length){
      const f = $("feed");
      const ph = f.querySelector(".empty"); if(ph) ph.parentElement.remove();
      f.insertAdjacentHTML("afterbegin", s.calls.slice().reverse().map(c=>`
        <div class="call"><span class="mm">${esc(c.method)}</span>
          <span class="pp" title="${esc(c.path)}">${esc(c.path)}</span>
          <span class="ss ${(c.status||0)>=400?"e":""}">${c.status??"—"}</span>
          <span class="dd">${ms(c.ms)}</span>
          ${c.note?`<span class="nn">${c.billable?"<b>billable</b> · ":""}${esc(c.note)}</span>`:""}
        </div>`).join(""));
      callSeq = s.call_seq;
    }
    $("call-count").textContent = `${s.call_seq} calls`;
    if(!s.call_seq && !$("feed").children.length)
      $("feed").innerHTML = '<div style="padding:11px 15px"><span class="empty">No calls yet.</span></div>';
  }

  async function post(path, body){
    Object.keys(drawn).forEach(k => drawn[k] = null);
    try{
      const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body||{})});
      if(!r.ok){ const j = await r.json(); alert(j.detail); }
    }catch(e){ alert(String(e)); }
    poll();
  }

  async function toggle(i){
    const s = last || await (await fetch("/api/state")).json();
    const c = s.commitments[i]; if(!c) return;
    c.chosen = !c.chosen;                 // optimistic, so the tick is instant
    drawn.addon = null; render(s);
    await fetch("/api/toggle",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({quote:c.quote,on:c.chosen})});
    poll();
  }

  poll(); setInterval(poll, 900);
</script>
