[project]
name = "thread-to-letter"
version = "1.0.0"
description = "Turn a messy email thread into a formal letter that states only what people actually committed to."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishvamsinh Vaghela" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
thread2letter = "thread_to_letter.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thread_to_letter"]

[tool.hatch.build.targets.wheel.force-include]
"src/thread_to_letter/console.html" = "thread_to_letter/console.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"
