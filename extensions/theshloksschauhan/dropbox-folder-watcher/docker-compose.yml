version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: superdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/superdocs
      # Add DROPBOX_ACCESS_TOKEN and SUPERDOCS_API_KEY in .env file
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  daemon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.daemon"]
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/superdocs
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8001/api
    depends_on:
      - api

volumes:
  postgres_data:
