services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: webhook_receiver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_receiver"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: python scripts/predeploy.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/webhook_receiver
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:10000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/webhook_receiver
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/webhook_receiver
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
