name: deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: make build

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: make deploy ENV=production

  drain-print-queue:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: make drain-queue
