# Renamed from `tracking-api` to `tracking-ingest` when the read path moved out
# to the edge cache. Page 1003 still says `tracking-api`, which is the planted
# renamed-deployment drift.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-ingest
  namespace: tracking
  labels:
    app.kubernetes.io/name: tracking-ingest
    meridian.io/tier: "2"
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-ingest
    spec:
      containers:
        - name: ingest
          image: ghcr.io/meridian/tracking-ingest:1.9.3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
