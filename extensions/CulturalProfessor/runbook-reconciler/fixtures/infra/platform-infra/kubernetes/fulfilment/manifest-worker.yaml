apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-worker
  namespace: fulfilment
  labels:
    app.kubernetes.io/name: manifest-worker
    meridian.io/tier: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: manifest-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manifest-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/meridian/manifest-worker:3.0.7
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
