[project]
name = "runbook-reconciler"
version = "0.1.0"
description = "Verifies operational runbooks against the infrastructure config they describe, and lands approved fixes as surgical Confluence edits"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.16", "black>=24"]

[project.scripts]
runbook-reconciler = "reconciler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "reconciler",
    "reconciler.check",
    "reconciler.confluence",
    "reconciler.extract",
    "reconciler.readers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["out", "*.egg-info"]

[tool.ruff.lint]
# Formatting (line wrapping, quotes, trailing commas) is Black's job, run
# separately -- ruff here is lint-only, so E501 is off; Black owns line length.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "A"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["reconciler"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "out/"
