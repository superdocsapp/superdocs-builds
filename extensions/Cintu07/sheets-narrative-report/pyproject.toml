[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sheets-narrative-report"
version = "0.1.0"
description = "Turn a Google Sheets range into a written report on the firm template, with every number traceable to a cell."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_report"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
