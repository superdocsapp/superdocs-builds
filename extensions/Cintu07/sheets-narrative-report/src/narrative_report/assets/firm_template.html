<div class="firm-report">
  <style>
    .firm-report { font-family: Georgia, "Times New Roman", serif; color: #1a1a1a; line-height: 1.55; }
    .firm-letterhead { border-bottom: 2px solid #1f4e79; padding-bottom: 10px; margin-bottom: 22px; }
    .firm-mark { font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 2px;
                 text-transform: uppercase; color: #1f4e79; font-weight: bold; }
    .report-title { font-size: 24px; margin: 8px 0 4px; color: #1f4e79; }
    .report-meta { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #666666; margin: 0; }
    .report-heading { font-size: 15px; margin: 22px 0 6px; color: #1f4e79;
                      font-family: Arial, Helvetica, sans-serif; }
    .firm-report p { margin: 0 0 10px; }
    .firm-report ul { margin: 0 0 10px 18px; }
    .report-chart { margin: 18px 0; text-align: center; }
    .firm-footer { border-top: 1px solid #cccccc; margin-top: 28px; padding-top: 8px;
                   font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #888888; }
  </style>

  <div class="firm-letterhead">
    <div class="firm-mark">Northgate Partners &middot; Finance</div>
    <h1 class="report-title">{{title}}</h1>
    <p class="report-meta">{{meta}}</p>
  </div>

  {{body}}

  <div class="firm-footer">
    Prepared from the linked spreadsheet range. Every figure in this report is
    substituted directly from the source cells and is reviewed before release.
  </div>
</div>
