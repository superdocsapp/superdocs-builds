[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live-doc-agent"
version = "0.1.0"
description = "AI agent that keeps wiki pages synchronized with new decisions using SuperDocs surgical edits and human-in-the-loop approval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Nishanth Prabhu" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
