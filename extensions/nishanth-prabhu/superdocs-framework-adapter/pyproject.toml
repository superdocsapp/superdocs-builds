[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superdocs-framework-adapter"
version = "0.1.0"
description = "Framework-neutral adapter for SuperDocs document operations"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["superdocs_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
