<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SuperDocs Document</title>
<style>
body { font-family: 'Inter', 'Calibri', Arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #000; max-width: 8.5in; margin: 1in auto; padding: 0 0.5in; }
h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', 'Inter', sans-serif; }
table { border-collapse: collapse; max-width: 100%; }
table[data-sd-table-default] { width: 100%; }
table[data-sd-table-default] th, table[data-sd-table-default] td { border: 1px solid #888; padding: 6px 8px; }
blockquote { border-left: 3px solid #ccc; padding-left: 1em; color: #555; font-style: italic; }
pre { background: #f5f5f5; padding: 0.5em; border-radius: 3px; font-family: 'Consolas', monospace; overflow-x: auto; }
code { font-family: 'Consolas', monospace; background: #f5f5f5; padding: 1px 4px; border-radius: 2px; }
img { max-width: 100%; height: auto; }
ins { background: #d4edda; text-decoration: none; }
del { background: #f8d7da; text-decoration: line-through; }
aside { background: #fff3cd; padding: 4px 8px; border-radius: 3px; font-style: italic; font-size: 0.9em; display: inline-block; }
</style>
</head>
