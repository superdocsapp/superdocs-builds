[project]
name = "docs-lint"
version = "0.1.0"
description = "A house-style gate for Markdown documents in a repository, powered by SuperDocs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayush Chaudhari" }]
keywords = ["linter", "markdown", "style-guide", "pre-commit", "superdocs"]

dependencies = [
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.optional-dependencies]
review = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
docs-lint = "docs_lint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "resume: kills and restarts a real run to prove no work is lost",
    "concurrency: runs two linters at once to prove state does not corrupt",
    "injection: feeds the linter a document that tries to give it orders",
    "live: requires SUPERDOCS_API_KEY; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The review page is an embedded HTML/CSS/JS template. Python line limits do not apply to it,
# and breaking CSS rules across lines to satisfy a Python linter would make it harder to read.
"src/docs_lint/review/server.py" = ["E501"]
