[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-gateway"
version = "0.1.0"
description = "MCP proxy: tool allowlists, content scanning, quotas, and audit logging for SuperDocs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
]

[project.scripts]
gateway = "gateway.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real SuperDocs API (deselect with -m 'not live')",
]
