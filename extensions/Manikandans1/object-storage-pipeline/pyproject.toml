[project]
name = "superdocs-object-storage-pipeline"
version = "0.1.0"
description = "S3/GCS drop-triggered ingest, edit, and write-back through SuperDocs, using pre-signed URLs throughout"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "moto[s3]>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
