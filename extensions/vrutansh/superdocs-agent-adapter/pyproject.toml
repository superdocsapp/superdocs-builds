[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "superdocs-agent-adapter"
version = "0.1.0"
description = "A framework-independent SuperDocs adapter with thin agent-framework bindings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vrutansh Patel" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "respx>=0.21,<1"]
langgraph = ["langgraph>=1.0,<2", "langchain-core>=1.0,<2"]
crewai = ["crewai>=1.0,<2"]
openai-agents = ["openai-agents>=0.6,<1"]
all-frameworks = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "crewai>=1.0,<2",
  "openai-agents>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/superdocs_adapter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: calls the live SuperDocs API"]
