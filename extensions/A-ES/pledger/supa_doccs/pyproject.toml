[project]
name = "agentic-doc-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "psycopg2-binary",
    "pgvector",
    "sqlalchemy",
    "mcp",
    "openai",
    "python-multipart",
    "python-dotenv",
    "sse-starlette",
    "pdfplumber",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "httpx",
    "anyio[trio]",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
