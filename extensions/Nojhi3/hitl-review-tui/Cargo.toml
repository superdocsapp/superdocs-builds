[package]
name = "hitl-review-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal HITL review TUI: review proposed changes as coloured diffs, accept/reject/edit, then commit the approved batch."

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"