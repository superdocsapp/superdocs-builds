[project]
name = "product-manual-builder"
version = "0.1.0"
description = "One product spec; a manual and a quick-start card generated from it, with deterministic diagrams"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
manualbuilder = "manualbuilder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["manualbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
