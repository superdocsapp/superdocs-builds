# Three services, and `docker compose up` starts all of them:
#   db   — Postgres, the record of truth for inspections, findings, photos and decisions
#   api  — FastAPI backend; holds the SuperDocs key, which never reaches the browser
#   web  — the React interface an inspector actually uses
#
# No API key is required. PROVIDER defaults to `fake`, a deterministic implementation of the
# same typed protocol as the live client, so a fresh clone gives you a working application.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inspect
      POSTGRES_PASSWORD: inspect
      POSTGRES_DB: inspect
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspect -d inspect"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inspect:inspect@db:5432/inspect
      PROVIDER: ${PROVIDER:-fake}
      PHOTO_STORE_DIR: /app/data/photos
      FAKE_IMAGE_DIR: /app/data/fake-images
      # The fake stands in for another machine, so its sessions and jobs have to be reachable
      # from every process that talks to it — the worker proposes, this container approves.
      FAKE_STATE_DIR: /app/data/fake-state
      SUPERDOCS_API_KEY: ${SUPERDOCS_API_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config
      - ./migrations:/app/migrations
      # Photograph bytes live here rather than in Postgres. A named volume, so they
      # survive `docker compose down` the way the database does.
      - photo-data:/app/data/photos
      - fake-image-data:/app/data/fake-images
      - fake-state-data:/app/data/fake-state
      - ./templates:/app/templates
      - ./sample:/app/sample
      # Exports must land where the host can see them: a --rm container's writes outside a
      # mounted path are destroyed when it exits.
      - ./exports:/app/exports
    working_dir: /app
    command: ["uvicorn", "inspection_report.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # The slow work. Separate from the API because a background task inside the web process
  # dies with it, and a run that vanishes on a deploy has already been paid for. Scale it by
  # raising the replica count — the claim is FOR UPDATE SKIP LOCKED, so two are safe.
  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inspect:inspect@db:5432/inspect
      PROVIDER: ${PROVIDER:-fake}
      SUPERDOCS_API_KEY: ${SUPERDOCS_API_KEY:-}
      PHOTO_STORE_DIR: /app/data/photos
      FAKE_IMAGE_DIR: /app/data/fake-images
      FAKE_STATE_DIR: /app/data/fake-state
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./templates:/app/templates
      - ./migrations:/app/migrations
      - photo-data:/app/data/photos
      - fake-image-data:/app/data/fake-images
      - fake-state-data:/app/data/fake-state
    working_dir: /app
    command: ["python", "-m", "inspection_report.worker"]

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  db-data:
  photo-data:
  fake-image-data:
  fake-state-data:
