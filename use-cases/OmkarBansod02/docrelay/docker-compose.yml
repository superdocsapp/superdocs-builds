services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docrelay
      POSTGRES_USER: docrelay
      POSTGRES_PASSWORD: docrelay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrelay -d docrelay"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - docrelay-postgresql:/var/lib/postgresql/data

volumes:
  docrelay-postgresql:
