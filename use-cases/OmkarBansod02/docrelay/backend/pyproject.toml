[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "docrelay-backend"
version = "0.1.0"
description = "Safety-first control plane for approved cloud-document write-back"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.19.0",
  "asyncpg==0.31.0",
  "cryptography==46.0.3",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docrelay"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_google: opt-in test requiring an already configured real Google OAuth connection",
  "live_superdocs: opt-in Phase 3 proof requiring configured Google and SuperDocs credentials",
  "postgresql: opt-in test requiring the local PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["docrelay"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
