[project]
name = "afteraction"
version = "0.1.0"
description = "Storm restoration after-action report builder, drafted inside a SuperDocs document"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
afteraction = "afteraction.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling builds in a temporary directory, so no metadata folder is left beside the
# source. It also ships everything inside the package directory, which is what carries
# templates/report.html — the report's design — into the installed package.
[tool.hatch.build.targets.wheel]
packages = ["src/afteraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
