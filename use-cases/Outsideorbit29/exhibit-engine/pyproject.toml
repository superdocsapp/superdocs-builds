[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhibit-engine"
version = "1.0.0"
description = "Evidence exhibit indexer and cover-page engine for an immigration paralegal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pypdfium2>=5",
    "python-docx>=1.1",
]

[project.optional-dependencies]
crew = ["crewai>=1.15", "crewai[google-genai]"]
tests = ["pytest>=8"]

[project.scripts]
exhibit-engine = "exhibit.cli:main"

[tool.setuptools]
packages = ["exhibit"]
