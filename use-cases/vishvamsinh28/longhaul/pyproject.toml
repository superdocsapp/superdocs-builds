[project]
name = "longhaul"
version = "1.0.0"
description = "A durable runner for SuperDocs editing jobs that outlast one sitting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishvamsinh Vaghela" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # The MCP server is part of the deliverable, not an add-on: a fresh clone should
    # have every surface working without anyone knowing to ask for an extra.
    "mcp>=2.0",
]

[project.scripts]
longhaul = "longhaul.cli:app"
longhaul-mcp = "longhaul.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longhaul"]

[tool.hatch.build.targets.wheel.force-include]
"src/longhaul/review.html" = "longhaul/review.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=300"
markers = ["proof: the kill-point byte-identity proof (slow)"]
