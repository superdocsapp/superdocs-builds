      exactly.","tool_choice":{"type":"tool","name":"extract_recognition_schedule_facts"},"tools":[{"name":"extract_recognition_schedule_facts","description":"For
      each given performance obligation, extract the structured timing facts needed
      to build a revenue recognition schedule.","input_schema":{"type":"object","properties":{"schedule_facts":{"type":"array","items":{"type":"object","properties":{"obligation_id":{"type":"string","description":"MUST
      match one of the obligation ids given in the context -- do not invent a new
      one."},"term_start_description":{"type":"string","description":"When the recognition
      period begins, in the contract''s own words, e.g. ''the Effective Date'' or
      ''upon Buyer''s acceptance''."},"term_length_months":{"type":"integer","description":"How
      many months the recognition period spans. Use 1 for a point-in-time obligation
      (all revenue recognized in a single period)."},"source_quote":{"type":"string","description":"The
      EXACT verbatim contract text supporting term_start_description and term_length_months
      -- copy precisely, never paraphrase."}},"required":["obligation_id","term_start_description","term_length_months","source_quote"]}}},"required":["schedule_facts"]}}]}'
