[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "drafter"]

[project]
name = "revenue-recognition-drafter"
version = "0.1.0"
description = "Turns a contract into a revenue recognition memo, verified against the contract and drafted through SuperDocs."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "httpx>=0.28",
    "tenacity>=9.1",
    "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "vcrpy>=6.0",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "core", "drafter"]
