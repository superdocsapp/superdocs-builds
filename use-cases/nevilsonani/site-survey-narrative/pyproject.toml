[project]
name = "survey2narrative"
version = "0.1.0"
description = "Site Survey to Design Narrative - built ON SuperDocs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "typer>=0.12",
]

[project.scripts]
s2n = "survey2narrative.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey2narrative"]
