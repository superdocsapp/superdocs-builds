<svg viewBox="0 0 760 1060" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect width="760" height="1060" fill="#fafaf7"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">RFE Response Builder — full flow</text>

  <!-- legend -->
  <rect x="40" y="58" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="66" y="72" font-size="13" fill="#333">Code (free, deterministic)</text>
  <rect x="280" y="58" width="18" height="18" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="306" y="72" font-size="13" fill="#333">SuperDocs AI (billable)</text>
  <rect x="540" y="58" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="566" y="72" font-size="13" fill="#333">Human (the attorney)</text>

  <!-- 1 input -->
  <rect x="130" y="95" width="500" height="66" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="380" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">1. INPUT — files</text>
  <text x="380" y="144" text-anchor="middle" font-size="13" fill="#444">Officer's notice + petition documents (.md .txt .pdf .docx)</text>
  <line x1="380" y1="161" x2="380" y2="185" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 parse -->
  <rect x="130" y="188" width="500" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">2. PARSE — code</text>
  <text x="380" y="237" text-anchor="middle" font-size="13" fill="#444">Split the notice into its numbered requests: R1, R2, R3... exactly as written</text>
  <line x1="380" y1="254" x2="380" y2="278" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 retrieve -->
  <rect x="130" y="281" width="500" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">3. LOCATE — code</text>
  <text x="380" y="330" text-anchor="middle" font-size="13" fill="#444">Where does the petition answer each request? (file + section recorded)</text>
  <line x1="380" y1="347" x2="380" y2="371" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 judge -->
  <rect x="130" y="374" width="500" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">4. JUDGE — SuperDocs AI</text>
  <text x="380" y="420" text-anchor="middle" font-size="13" fill="#444">The model reads each match: fully answered / partially / not provided + why</text>
  <text x="380" y="440" text-anchor="middle" font-size="12" fill="#7c2d12">Code verifies: "answered" with no located material is overridden</text>
  <line x1="380" y1="454" x2="380" y2="478" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 skeleton -->
  <rect x="130" y="481" width="500" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="507" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">5. SKELETON — code</text>
  <text x="380" y="527" text-anchor="middle" font-size="13" fill="#444">Code builds the whole document first: requests quoted, citations placed,</text>
  <text x="380" y="547" text-anchor="middle" font-size="13" fill="#444">checklist built — only the answers are left as [DRAFT — TO BE WRITTEN]</text>
  <line x1="380" y1="561" x2="380" y2="585" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 draft -->
  <rect x="130" y="588" width="500" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="614" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">6. DRAFT — SuperDocs AI (billable)</text>
  <text x="380" y="634" text-anchor="middle" font-size="13" fill="#444">Upload + instruction: "fill the placeholders ONLY from the given material;</text>
  <text x="380" y="654" text-anchor="middle" font-size="13" fill="#444">where evidence is missing, say 'not provided'" — SuperDocs proposes changes</text>
  <line x1="380" y1="668" x2="380" y2="692" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 7 human gate -->
  <rect x="130" y="695" width="500" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="721" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">7. HUMAN GATE — the attorney</text>
  <text x="380" y="741" text-anchor="middle" font-size="13" fill="#444">Review every proposed change → approve, or reject with feedback</text>
  <text x="380" y="761" text-anchor="middle" font-size="12" fill="#14532d">Nothing is applied to the document without an explicit yes</text>
  <line x1="380" y1="775" x2="380" y2="799" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 8 export -->
  <rect x="130" y="802" width="500" height="66" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="829" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">8. EXPORT — SuperDocs, free</text>
  <text x="380" y="851" text-anchor="middle" font-size="13" fill="#444">Download the final document: .md + .docx</text>
  <line x1="380" y1="868" x2="380" y2="892" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 9 verify -->
  <rect x="130" y="895" width="500" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="921" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">9. VERIFY — code</text>
  <text x="380" y="941" text-anchor="middle" font-size="13" fill="#444">Every placeholder filled? Officer quotes untouched? Citations verbatim,</text>
  <text x="380" y="961" text-anchor="middle" font-size="13" fill="#444">real, and none removed? Gap language honest? Any failure = do not file</text>
  <text x="380" y="981" text-anchor="middle" font-size="12" fill="#1e3a8a">Result: RFE response package + coverage checklist</text>

  <!-- side note -->
  <text x="380" y="1030" text-anchor="middle" font-size="13" fill="#666">Code splits, locates, verifies · SuperDocs' AI judges and writes · the human decides</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>
</svg>
