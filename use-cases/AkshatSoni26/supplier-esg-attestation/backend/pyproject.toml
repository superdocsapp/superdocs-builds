[project]
name = "superdocs-esg-attestation-backend"
version = "0.1.0"
description = "SuperDocs Supplier ESG Attestation & Compliance Engine"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
