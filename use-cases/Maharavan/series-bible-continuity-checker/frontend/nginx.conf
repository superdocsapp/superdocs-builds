server { listen 80; root /usr/share/nginx/html; index index.html; location / { try_files $uri /index.html; } location /api/ { proxy_pass http://host.docker.internal:8000; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 300s; proxy_send_timeout 300s; client_max_body_size 25m; } location /health/ { proxy_pass http://host.docker.internal:8000; } }
