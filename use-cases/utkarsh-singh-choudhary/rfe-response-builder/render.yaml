services:
  - type: web
    name: rfe-response-builder
    runtime: python
    plan: free
    buildCommand: "pip install -r webapp/requirements.txt"
    # workers=2/threads=4: the review-session store is now SQLite-backed
    # (webapp/review_store.py) at /tmp, which every worker on this single
    # Render instance shares via local disk -- multiple workers no longer
    # split review state the way the earlier in-memory dict did. Scaling
    # to multiple *instances* (not just workers) would still need a real
    # shared store (Postgres/Redis) instead of local SQLite.
    # timeout=120 covers a real (non-dry-run) draft pass, which makes one
    # SuperDocs turn per RFE item plus header/checklist/exhibit/export
    # turns -- gunicorn's 30s default would kill that request mid-draft.
    startCommand: "gunicorn --chdir webapp --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SUPERDOCS_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: GENERATE_RATE_LIMIT
        value: "10 per hour"
      - key: LOG_LEVEL
        value: INFO
