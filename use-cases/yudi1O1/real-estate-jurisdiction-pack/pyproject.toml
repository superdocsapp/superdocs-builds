[project]
name = "real-estate-jurisdiction-pack"
version = "0.1.0"
description = "Jurisdiction-aware residential lease and disclosure packs, built on the SuperDocs API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["real_estate_pack*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
