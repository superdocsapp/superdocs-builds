# The blocking gate, demonstrated. This record is deliberately incomplete.
#
#   python -m real_estate_pack check examples/incomplete_ca_unanswered.yaml
#
# Two California applicability questions are left unanswered:
#   - death_on_premises_last_3_years   (Civ. Code § 1710.2)
#   - known_mold_health_threat         (Health & Safety Code § 26147)
#
# A two-state engine would read "absent" as "no" and quietly omit both
# disclosures. The resulting lease would look completely normal. This pack
# refuses instead, and names the exact fact and the exact authority.
#
# Note also that the flood pair is HALF answered: in_special_flood_hazard_area is
# false but in_area_of_potential_flooding is missing. Because the rule is an OR,
# one false and one unknown is genuinely undecidable — the disclosure could still
# be required. The engine says so rather than guessing.
#
# Fill the three missing facts in and it passes (subject to the two stale
# California rules, which still need --allow-stale).
#
# Fictional parties and a fictional property.

