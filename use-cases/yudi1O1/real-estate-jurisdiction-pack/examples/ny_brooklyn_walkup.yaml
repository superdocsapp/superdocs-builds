# New York — pre-1960 stock, the sprinkler notice, and a Good Cause flag.
#
#   python -m real_estate_pack check examples/ny_brooklyn_walkup.yaml
#
# Blocks by design on two fast-moving rules (the pre-1960 lead pointer and the
# 2024 Good Cause Eviction status notice). Add --allow-stale to assemble with
# both marked UNVERIFIED.
#
# Note the deposit: one month exactly. New York caps it at one month statewide
# with no small-landlord exception, unlike California.
#
# Fictional parties and a fictional property.

pack_id: NY-BKN-0342
jurisdiction: US-NY

property:
  street_address: 342 Sackett Street
  unit: "2R"
  city: Brooklyn
  state: NY
  postal_code: "11231"
  county: Kings
  year_built: 1928          # pre-1960 AND pre-1978 — both lead rules engage
  property_type: apartment
  units_in_building: 6

tenancy:
  start_date: "2026-11-01"
  end_date: "2027-10-31"
  monthly_rent: 3400.00
  security_deposit: 3400.00 # one month — the statutory maximum in New York
  rent_due_day: 1
  furnished: false
  pets_permitted: false
  term_type: fixed

landlord:
  name: Sackett Street Partners LP
  address: 55 Court Street, Brooklyn, NY 11201

tenants:
  - name: Aisha Bello
  - name: Tomás Iglesias

disclosure_facts:
  # Real Property Law § 231-b requires the sprinkler notice in EVERY residential
  # lease, in both directions — a building without a system still needs the
  # notice saying so. Hence the rule tests is_set rather than is_true.
  sprinkler_system_present: false
