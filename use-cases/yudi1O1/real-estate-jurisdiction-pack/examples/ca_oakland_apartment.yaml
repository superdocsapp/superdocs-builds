# California — the heavy-disclosure case, and the staleness demonstration.
#
#   python -m real_estate_pack check examples/ca_oakland_apartment.yaml
#
# This BLOCKS by design. Two California rules — the Tenant Protection Act notice
# and the AB 12 security deposit cap — carry a short review cadence because both
# have been amended recently, and both are past their review date. That is the
# gate working, not a bug.
#
# To see the pack assemble anyway, with those two rules stamped UNVERIFIED in the
# compliance index:
#
#   python -m real_estate_pack preview examples/ca_oakland_apartment.yaml \
#       --out-dir out --allow-stale
#
# Fictional parties and a fictional property.

pack_id: CA-OAK-1187
jurisdiction: US-CA

property:
  street_address: 1187 Telegraph Avenue
  unit: "4B"
  city: Oakland
  state: CA
  postal_code: "94612"
  county: Alameda
  year_built: 1962          # pre-1978, so the federal lead-paint disclosure fires
  property_type: apartment
  units_in_building: 22

tenancy:
  start_date: "2026-10-01"
  end_date: "2027-09-30"
  monthly_rent: 3150.00
  security_deposit: 3150.00 # exactly one month — at the AB 12 cap, not over it
  rent_due_day: 1
  furnished: false
  pets_permitted: false
  term_type: fixed

landlord:
  name: Telegraph Commons Holdings LLC
  address: 2100 Franklin Street, Oakland, CA 94612

tenants:
  - name: Marisol Vega-Ortiz

disclosure_facts:
  # Each of these answers a California applicability question. Leaving any of
  # them out does not switch the disclosure off — it blocks the pack, because
  # "nobody asked" and "the answer is no" are different things.
  death_on_premises_last_3_years: false
  known_mold_health_threat: false
  in_special_flood_hazard_area: false
  in_area_of_potential_flooding: false
  demolition_permit_applied_for: false
  utility_meter_serves_other_areas: true   # fires the shared-meter disclosure
